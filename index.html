<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鋼鐵人賈維斯 (Jarvis HUD) - 陳河志的AI超級大腦</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(14, 23, 42, 0.82);
      --border-color: rgba(0, 242, 254, 0.28);
      --cyan-glow: #00f2fe;
      --blue-glow: #4facfe;
      --green-glow: #10b981;
      --red-glow: #ef4444;
      --gold-glow: #fbbf24;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #111e38 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部導航列 */
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.5);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--cyan-glow);
    }

    .session-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(0, 242, 254, 0.4);
      background: rgba(0, 242, 254, 0.08);
      cursor: pointer;
    }

    .session-badge.master {
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.1);
      color: var(--gold-glow);
    }

    /* 中央賈維斯核心區 (HUD ARC REACTOR) */
    .reactor-container {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 16px;
      position: relative;
    }

    .arc-reactor {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .arc-reactor::before {
      content: '';
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }

    .core-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 0%, #0369a1 80%);
      border: none;
      color: #fff;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
      cursor: pointer;
      z-index: 2;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .core-btn:active {
      transform: scale(0.92);
    }

    /* 核心狀態動畫 */
    .arc-reactor.listening {
      border-color: var(--green-glow);
      animation: rotate-arc 4s linear infinite;
    }
    .arc-reactor.listening .core-btn {
      background: radial-gradient(circle, #34d399 0%, #059669 80%);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.85);
      animation: pulse-green 1.2s infinite;
    }

    .arc-reactor.thinking {
      border-color: var(--gold-glow);
      animation: rotate-arc 1.5s linear infinite;
    }
    .arc-reactor.thinking .core-btn {
      background: radial-gradient(circle, #fde047 0%, #d97706 80%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.85);
    }

    .arc-reactor.speaking {
      border-color: var(--blue-glow);
      animation: pulse-ring 1s infinite alternate;
    }
    .arc-reactor.speaking .core-btn {
      background: radial-gradient(circle, #38bdf8 0%, #1d4ed8 80%);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.9);
    }

    .arc-reactor.interrupted {
      border-color: var(--red-glow);
    }
    .arc-reactor.interrupted .core-btn {
      background: radial-gradient(circle, #f87171 0%, #b91c1c 80%);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.95);
    }

    @keyframes rotate-arc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-green {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.05); }
    }

    /* 狀態提示橫幅 */
    .status-banner {
      margin-top: 14px;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan-glow);
    }

    /* 對話歷史氣泡區 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 18px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--panel-bg);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .bubble.system {
      align-self: center;
      font-size: 13px;
      color: var(--cyan-glow);
      background: rgba(0, 242, 254, 0.08);
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 12px;
      padding: 6px 14px;
    }

    /* 快捷提問按鈕 */
    .quick-bar {
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .quick-bar::-webkit-scrollbar { display: none; }

    .quick-chip {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .quick-chip:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--cyan-glow);
      color: #fff;
    }

    /* 底部輸入控制列 */
    footer {
      padding: 12px 16px 20px;
      background: rgba(7, 11, 20, 0.95);
      border-top: 1px solid rgba(0, 242, 254, 0.2);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 12px 18px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      border: none;
      color: #04101e;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- 頂部資訊 -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">JARVIS 鋼鐵人核心</div>
        <div class="brand-subtitle">陳河志的AI超級大腦・語音中樞</div>
      </div>
    </div>
    <div id="sessionBtn" class="session-badge master" onclick="toggleSession()">
      👑 阿志長效記憶
    </div>
  </header>

  <!-- 中央弧形反應爐 (Arc Reactor) -->
  <div class="reactor-container">
    <div id="arcReactor" class="arc-reactor" onclick="toggleJarvisMode()">
      <button id="coreBtn" class="core-btn" title="點擊切換賈維斯模式">🎙️</button>
    </div>
    <div id="statusBanner" class="status-banner">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">點擊反應爐啟動賈維斯連續免手持對話</span>
    </div>
  </div>

  <!-- 快捷提問 -->
  <div class="quick-bar">
    <div class="quick-chip" onclick="sendQuick('賈維斯，我戴著耳機，測試一下連線狀態')">🎧 測試連線</div>
    <div class="quick-chip" onclick="sendQuick('今天門市有哪些重要事項與待辦？')">📅 今日行程</div>
    <div class="quick-chip" onclick="sendQuick('幫我介紹一下翔頂發財開運咖啡與伴手禮優勢')">☕ 咖啡伴手禮</div>
    <div class="quick-chip" onclick="sendQuick('客人問到胃脹氣與微循環，我該怎麼生活化引導？')">🌿 亞健康破冰</div>
  </div>

  <!-- 對話紀錄區 -->
  <div id="chatBox" class="chat-container">
    <div class="bubble assistant">
      阿志你好！我是你的賈維斯數位大腦。<br>
      在此安全環境下，點擊上方反應爐即可進入<strong>「連續免動手對話」</strong>。<br>
      你戴著耳機烘豆或煮咖啡時，我回覆中你<strong>隨時直接開口說話</strong>，我會立刻閉嘴聽你說！
    </div>
  </div>

  <!-- 底部手動輸入列 -->
  <footer>
    <input type="text" id="textInput" class="input-box" placeholder="說出指令，或在此打字..." onkeydown="if(event.key==='Enter') sendManual()">
    <button class="send-btn" onclick="sendManual()">➤</button>
  </footer>

  <script>
    // ===== 配置設定 =====
    const CHAT_WEBHOOK_URL = 'https://oeccafecf.zeabur.app/webhook/a440835f-893a-4b46-a5a0-c9fdd9b129e7/chat';
    
    // 檢查 URL 參數
    const urlParams = new URLSearchParams(window.location.search);
    let isMaster = urlParams.get('user') === 'simon' || true; // 預設為阿志
    let currentSessionId = isMaster ? 'voice-user-simon-master' : ('voice-guest-' + Date.now());

    let isJarvisActive = false;
    let recognition = null;
    let isSpeaking = false;
    let isThinking = false;
    let synth = window.speechSynthesis;

    // DOM 元素
    const arcReactor = document.getElementById('arcReactor');
    const coreBtn = document.getElementById('coreBtn');
    const statusBanner = document.getElementById('statusBanner');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const sessionBtn = document.getElementById('sessionBtn');

    // 更新 Session 顯示
    function updateSessionUI() {
      if (isMaster) {
        sessionBtn.className = 'session-badge master';
        sessionBtn.innerHTML = '👑 阿志長效記憶';
        currentSessionId = 'voice-user-simon-master';
      } else {
        sessionBtn.className = 'session-badge';
        sessionBtn.innerHTML = '☕ 門市訪客模式';
        currentSessionId = 'voice-guest-' + Date.now();
      }
    }

    function toggleSession() {
      isMaster = !isMaster;
      updateSessionUI();
      appendBubble('system', `已切換為：${isMaster ? '阿志長效記憶模式 (個人專屬)' : '門市訪客模式 (用完即走)'}`);
    }

    // 更新狀態樣式
    function setStatus(state, text) {
      statusText.innerText = text;
      arcReactor.className = 'arc-reactor ' + state;
      
      if (state === 'listening') {
        statusDot.style.background = 'var(--green-glow)';
        statusBanner.style.borderColor = 'var(--green-glow)';
        coreBtn.innerText = '🎙️';
      } else if (state === 'thinking') {
        statusDot.style.background = 'var(--gold-glow)';
        statusBanner.style.borderColor = 'var(--gold-glow)';
        coreBtn.innerText = '⚡';
      } else if (state === 'speaking') {
        statusDot.style.background = 'var(--blue-glow)';
        statusBanner.style.borderColor = 'var(--blue-glow)';
        coreBtn.innerText = '🔊';
      } else if (state === 'interrupted') {
        statusDot.style.background = 'var(--red-glow)';
        statusBanner.style.borderColor = 'var(--red-glow)';
        coreBtn.innerText = '🛑';
      } else {
        statusDot.style.background = 'var(--cyan-glow)';
        statusBanner.style.borderColor = 'var(--border-color)';
        coreBtn.innerText = '🎙️';
      }
    }

    // 氣泡加入
    function appendBubble(role, htmlText) {
      const b = document.createElement('div');
      b.className = 'bubble ' + role;
      b.innerHTML = htmlText;
      chatBox.appendChild(b);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 音效
    function playBeep(freq = 660, dur = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    // ===== 核心：語音辨識與即時插話打斷 =====
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('抱歉，此瀏覽器不支援 SpeechRecognition 語音功能，請使用 Chrome 瀏覽器！');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'zh-TW';

      rec.onstart = () => {
        if (isJarvisActive && !isSpeaking && !isThinking) {
          setStatus('listening', '● 賈維斯聆聽中... (隨時說話)');
        }
      };

      rec.onresult = (event) => {
        // 【核心機制：即時插話打斷 (Barge-in)】
        if (isSpeaking) {
          console.log('[Barge-in] 偵測到使用者開口，立即打斷發聲！');
          if (synth && synth.speaking) {
            synth.cancel();
          }
          isSpeaking = false;
          setStatus('interrupted', '🛑 偵測到插話！切換聆聽...');
          playBeep(440, 0.06);
        }

        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        if (interim && !isSpeaking && !isThinking) {
          statusText.innerText = '聽取中: ' + interim;
        }

        if (final.trim().length > 0) {
          const userMessage = final.trim();
          console.log('[User Speech Final]:', userMessage);
          handleUserQuery(userMessage);
        }
      };

      rec.onerror = (e) => {
        console.warn('SpeechRecognition Error:', e.error);
        if (e.error === 'not-allowed') {
          alert('請在瀏覽器網址列左側點擊圖示，允許麥克風使用權限！');
          stopJarvisMode();
        }
      };

      rec.onend = () => {
        console.log('SpeechRecognition ended.');
        // 若賈維斯模式仍在且沒有在說話/思考中，自動重啟保持待命
        if (isJarvisActive && !isSpeaking && !isThinking) {
          try {
            rec.start();
          } catch (e) {}
        }
      };

      return rec;
    }

    // 啟動 / 停止賈維斯模式
    function toggleJarvisMode() {
      if (isJarvisActive) {
        stopJarvisMode();
      } else {
        startJarvisMode();
      }
    }

    function startJarvisMode() {
      if (!recognition) {
        recognition = initSpeechRecognition();
      }
      if (!recognition) return;

      isJarvisActive = true;
      playBeep(880, 0.12);
      setStatus('listening', '● 賈維斯在線，請說...');
      try {
        recognition.start();
      } catch (e) {
        console.log('recognition already running:', e);
      }
      speak('賈維斯在線，阿志請說。');
    }

    function stopJarvisMode() {
      isJarvisActive = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (synth && synth.speaking) {
        synth.cancel();
      }
      isSpeaking = false;
      isThinking = false;
      setStatus('idle', '點擊反應爐啟動賈維斯連續免手持對話');
    }

    // 語音朗讀 (TTS)
    function speak(text, callback) {
      if (!synth) {
        if (callback) callback();
        return;
      }
      synth.cancel();

      // 純文字淨化，去掉 markdown 符號
      const clean = text.replace(/[*#`_\[\]()]/g, '').replace(/\n+/g, '，');
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'zh-TW';
      utter.rate = 1.05;
      utter.pitch = 1.0;

      // 優先選取台灣語音
      const voices = synth.getVoices();
      const twVoice = voices.find(v => v.lang.includes('TW') || v.lang.includes('Hant') || v.name.includes('Yating') || v.name.includes('Meijia') || v.name.includes('Google 國語'));
      if (twVoice) utter.voice = twVoice;

      utter.onstart = () => {
        isSpeaking = true;
        setStatus('speaking', '🔊 賈維斯回覆中...（隨時開口可插話打斷）');
      };

      utter.onend = () => {
        isSpeaking = false;
        if (isJarvisActive) {
          setStatus('listening', '● 賈維斯聆聽中... (隨時說話)');
          // 確保 recognition 保持在線
          try { recognition.start(); } catch(e) {}
        } else {
          setStatus('idle', '已待命');
        }
        if (callback) callback();
      };

      utter.onerror = () => {
        isSpeaking = false;
        if (isJarvisActive) setStatus('listening', '● 賈維斯聆聽中...');
        if (callback) callback();
      };

      synth.speak(utter);
    }

    // 處理使用者訊息 (送往 WF-07 大腦)
    async function handleUserQuery(msg) {
      if (!msg || msg.trim() === '') return;
      
      appendBubble('user', msg);
      isThinking = true;
      setStatus('thinking', '⚡ 賈維斯大腦思考中...');

      try {
        const response = await fetch(CHAT_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'sendMessage',
            chatInput: msg,
            sessionId: currentSessionId
          })
        });

        const data = await response.json();
        const reply = data.output || data.text || '已收到，大腦暫時無法產出回覆。';
        
        isThinking = false;
        appendBubble('assistant', reply);
        speak(reply);

      } catch (err) {
        console.error('Fetch WF-07 Error:', err);
        isThinking = false;
        const errText = '連線大腦伺服器逾時，請確認網路或 Zeabur 狀態。';
        appendBubble('assistant', errText);
        speak(errText);
      }
    }

    // 手動按鍵或按鈕送出
    function sendManual() {
      const val = textInput.value.trim();
      if (!val) return;
      textInput.value = '';
      handleUserQuery(val);
    }

    function sendQuick(promptText) {
      handleUserQuery(promptText);
    }

    // 初始化語音庫載入
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => synth.getVoices();
    }
  </script>
</body>
</html>
