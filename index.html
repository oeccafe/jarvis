<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鋼鐵人賈維斯 (郎雄老匠人靈魂版) - 陳河志的AI超級大腦</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(14, 23, 42, 0.85);
      --border-color: rgba(0, 242, 254, 0.28);
      --cyan-glow: #00f2fe;
      --blue-glow: #4facfe;
      --green-glow: #10b981;
      --red-glow: #ef4444;
      --gold-glow: #fbbf24;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #111e38 0%, var(--bg-dark) 85%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部導航列 */
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.5);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.2);
      color: var(--gold-glow);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--cyan-glow);
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(0, 242, 254, 0.4);
      background: rgba(0, 242, 254, 0.08);
      cursor: pointer;
      color: #e2e8f0;
      transition: all 0.2s ease;
    }
    .badge-btn:hover {
      background: rgba(0, 242, 254, 0.18);
    }
    .badge-btn.gold {
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.12);
      color: var(--gold-glow);
    }

    /* 中央賈維斯核心區 (HUD ARC REACTOR) */
    .reactor-container {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 10px;
      position: relative;
    }

    .arc-reactor {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .arc-reactor::before {
      content: '';
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 2px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }

    .core-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 0%, #0369a1 80%);
      border: none;
      color: #fff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
      cursor: pointer;
      z-index: 2;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .core-btn:active {
      transform: scale(0.92);
    }

    /* 核心狀態動畫 */
    .arc-reactor.listening {
      border-color: var(--green-glow);
      animation: rotate-arc 4s linear infinite;
    }
    .arc-reactor.listening .core-btn {
      background: radial-gradient(circle, #34d399 0%, #059669 80%);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.85);
      animation: pulse-green 1.2s infinite;
    }

    .arc-reactor.thinking {
      border-color: var(--gold-glow);
      animation: rotate-arc 1.5s linear infinite;
    }
    .arc-reactor.thinking .core-btn {
      background: radial-gradient(circle, #fde047 0%, #d97706 80%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.85);
    }

    .arc-reactor.speaking {
      border-color: var(--blue-glow);
      animation: pulse-ring 1s infinite alternate;
    }
    .arc-reactor.speaking .core-btn {
      background: radial-gradient(circle, #38bdf8 0%, #1d4ed8 80%);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.9);
    }

    .arc-reactor.interrupted {
      border-color: var(--red-glow);
    }
    .arc-reactor.interrupted .core-btn {
      background: radial-gradient(circle, #f87171 0%, #b91c1c 80%);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.95);
    }

    @keyframes rotate-arc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-green {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.05); }
    }

    /* 狀態提示橫幅 */
    .status-banner {
      margin-top: 10px;
      padding: 7px 18px;
      border-radius: 24px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan-glow);
    }

    /* 對話歷史氣泡區 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 84%;
      padding: 13px 18px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--panel-bg);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .bubble.system {
      align-self: center;
      font-size: 13px;
      color: var(--cyan-glow);
      background: rgba(0, 242, 254, 0.08);
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 12px;
      padding: 6px 14px;
    }

    /* 快捷提問按鈕 */
    .quick-bar {
      padding: 6px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .quick-bar::-webkit-scrollbar { display: none; }

    .quick-chip {
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .quick-chip:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--cyan-glow);
      color: #fff;
    }

    /* 底部輸入控制列 */
    footer {
      padding: 10px 16px 18px;
      background: rgba(7, 11, 20, 0.96);
      border-top: 1px solid rgba(0, 242, 254, 0.2);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 12px 18px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      border: none;
      color: #04101e;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- 頂部資訊 -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">
          JARVIS 賈維斯
          <span class="brand-badge">郎雄靈魂版</span>
        </div>
        <div class="brand-subtitle">陳河志的AI超級大腦・老匠人中樞</div>
      </div>
    </div>
    <div class="header-controls">
      <div id="voiceModeBtn" class="badge-btn gold" onclick="toggleVoiceEngine()" title="切換發聲模式">
        🎙️ 郎雄・神經老聲
      </div>
      <div id="sessionBtn" class="badge-btn" onclick="toggleSession()">
        👑 阿志長效記憶
      </div>
    </div>
  </header>

  <!-- 中央弧形反應爐 (Arc Reactor) -->
  <div class="reactor-container">
    <div id="arcReactor" class="arc-reactor" onclick="handleReactorClick()">
      <button id="coreBtn" class="core-btn" title="點擊反應爐">🎙️</button>
    </div>
    <div id="statusBanner" class="status-banner" onclick="handleReactorClick()">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">點擊反應爐喚醒郎雄老匠人賈維斯</span>
    </div>
  </div>

  <!-- 快捷提問 -->
  <div class="quick-bar">
    <div class="quick-chip" onclick="sendQuick('賈維斯，我戴著耳機正在烘豆，測試一下連線狀態')">🎧 測試連線</div>
    <div class="quick-chip" onclick="sendQuick('今天門市有哪些重要事項與待辦？')">📅 今日行程</div>
    <div class="quick-chip" onclick="sendQuick('幫我介紹一下翔頂發財開運咖啡與伴手禮優勢')">☕ 咖啡伴手禮</div>
    <div class="quick-chip" onclick="sendQuick('客人問到胃脹氣與微循環，我該怎麼生活化引導？')">🌿 亞健康破冰</div>
  </div>

  <!-- 對話紀錄區 -->
  <div id="chatBox" class="chat-container">
    <div class="bubble assistant">
      ……阿志，我在。<br>
      火候抓緊點，心要定。有什麼事情，你開口，我聽著。
    </div>
  </div>

  <!-- 底部手動輸入列 -->
  <footer>
    <input type="text" id="textInput" class="input-box" placeholder="說出指令，或在此打字..." onkeydown="if(event.key==='Enter') sendManual()">
    <button class="send-btn" onclick="sendManual()">➤</button>
  </footer>

  <script>
    // ===== 配置設定 =====
    const CHAT_WEBHOOK_URL = 'https://oeccafecf.zeabur.app/webhook/a440835f-893a-4b46-a5a0-c9fdd9b129e7/chat';
    
    // 神經語音端點 (優先呼叫 Zeabur 部署端點，若同源則呼叫 /api/tts)
    const NEURAL_TTS_URL = window.location.hostname.includes('zeabur') ? '/api/tts' : 'https://jarvis-oeccafe.zeabur.app/api/tts';

    const urlParams = new URLSearchParams(window.location.search);
    let isMaster = urlParams.get('user') === 'simon' || true;
    let currentSessionId = isMaster ? 'voice-user-simon-master' : ('voice-guest-' + Date.now());

    // 發聲引擎模式：'neural' (微軟神經老聲-雲健) 或 'local' (本機降頻男聲)
    let voiceEngine = 'neural'; 
    let activeAudio = null; // 當前播放中的 HTML5 Audio

    let isJarvisActive = false;
    let recognition = null;
    let isSpeaking = false;
    let isThinking = false;
    let synth = window.speechSynthesis;
    let silenceTimer = null;
    let currentTranscript = '';

    // DOM 元素
    const arcReactor = document.getElementById('arcReactor');
    const coreBtn = document.getElementById('coreBtn');
    const statusBanner = document.getElementById('statusBanner');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const sessionBtn = document.getElementById('sessionBtn');
    const voiceModeBtn = document.getElementById('voiceModeBtn');

    // 切換語音引擎
    function toggleVoiceEngine() {
      if (voiceEngine === 'neural') {
        voiceEngine = 'local';
        voiceModeBtn.className = 'badge-btn';
        voiceModeBtn.innerHTML = '🔊 郎叔・本地降頻';
        appendBubble('system', '已切換為：本機零延遲降頻男中低音（音調 0.82，語速 0.88）');
      } else {
        voiceEngine = 'neural';
        voiceModeBtn.className = 'badge-btn gold';
        voiceModeBtn.innerHTML = '🎙️ 郎雄・神經老聲';
        appendBubble('system', '已切換為：微軟極致老生神經原聲（滄桑深沉、老匠人質感）');
      }
    }

    // 更新 Session 顯示
    function updateSessionUI() {
      if (isMaster) {
        sessionBtn.className = 'badge-btn gold';
        sessionBtn.innerHTML = '👑 阿志長效記憶';
        currentSessionId = 'voice-user-simon-master';
      } else {
        sessionBtn.className = 'badge-btn';
        sessionBtn.innerHTML = '☕ 門市訪客模式';
        currentSessionId = 'voice-guest-' + Date.now();
      }
    }

    function toggleSession() {
      isMaster = !isMaster;
      updateSessionUI();
      appendBubble('system', `已切換為：${isMaster ? '阿志長效記憶模式 (個人專屬)' : '門市訪客模式 (用完即走)'}`);
    }

    // 更新狀態樣式
    function setStatus(state, text) {
      statusText.innerText = text;
      arcReactor.className = 'arc-reactor ' + state;
      
      if (state === 'listening') {
        statusDot.style.background = 'var(--green-glow)';
        statusBanner.style.borderColor = 'var(--green-glow)';
        coreBtn.innerText = '🎙️';
      } else if (state === 'thinking') {
        statusDot.style.background = 'var(--gold-glow)';
        statusBanner.style.borderColor = 'var(--gold-glow)';
        coreBtn.innerText = '⚡';
      } else if (state === 'speaking') {
        statusDot.style.background = 'var(--blue-glow)';
        statusBanner.style.borderColor = 'var(--blue-glow)';
        coreBtn.innerText = '🔊';
      } else if (state === 'interrupted') {
        statusDot.style.background = 'var(--red-glow)';
        statusBanner.style.borderColor = 'var(--red-glow)';
        coreBtn.innerText = '🛑';
      } else {
        statusDot.style.background = 'var(--cyan-glow)';
        statusBanner.style.borderColor = 'var(--border-color)';
        coreBtn.innerText = '🎙️';
      }
    }

    function appendBubble(role, htmlText) {
      const b = document.createElement('div');
      b.className = 'bubble ' + role;
      b.innerHTML = htmlText;
      chatBox.appendChild(b);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 科技反饋音
    function playBeep(type = 'wake') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'wake') {
          playTone(ctx, 440, 0, 0.1);
          playTone(ctx, 659, 0.08, 0.12);
        } else if (type === 'thinking') {
          playTone(ctx, 493, 0, 0.06);
          playTone(ctx, 587, 0.06, 0.08);
        } else if (type === 'stop') {
          playTone(ctx, 392, 0, 0.1);
        }
      } catch (e) {}
    }

    function playTone(ctx, freq, delay, dur) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + dur);
    }

    // ===== 核心：語音辨識與防回音機制 =====
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('此瀏覽器不支援 SpeechRecognition 語音功能，請使用 Chrome 瀏覽器！');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'zh-TW';

      rec.onstart = () => {
        if (isJarvisActive && !isSpeaking && !isThinking) {
          setStatus('listening', '● 賈維斯聆聽中... (隨時說話)');
        }
      };

      rec.onresult = (event) => {
        if (isSpeaking || isThinking) return;

        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const candidate = (final || interim).trim();
        if (candidate) {
          currentTranscript = candidate;
          statusText.innerText = '聽取中: ' + candidate;

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (currentTranscript && !isSpeaking && !isThinking) {
              const msg = currentTranscript;
              currentTranscript = '';
              handleUserQuery(msg);
            }
          }, 750);
        }

        if (final.trim().length > 0) {
          clearTimeout(silenceTimer);
          const msg = final.trim();
          currentTranscript = '';
          handleUserQuery(msg);
        }
      };

      rec.onerror = (e) => {
        console.warn('SpeechRecognition Error:', e.error);
        if (e.error === 'not-allowed') {
          alert('請在瀏覽器網址列左側點擊圖示，允許麥克風使用權限！');
          stopJarvisMode();
        }
      };

      rec.onend = () => {
        if (isJarvisActive && !isSpeaking && !isThinking) {
          try { rec.start(); } catch (e) {}
        }
      };

      return rec;
    }

    // 點擊反應爐：若正在發聲則「立即打斷」；否則切換開關
    function handleReactorClick() {
      if (isSpeaking) {
        interruptSpeech();
      } else {
        toggleJarvisMode();
      }
    }

    function interruptSpeech() {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }
      if (synth && synth.speaking) {
        synth.cancel();
      }
      isSpeaking = false;
      playBeep('stop');
      setStatus('interrupted', '🛑 已為你打斷回覆，切換聆聽...');
      setTimeout(() => {
        if (isJarvisActive) safeStartRecognition();
      }, 300);
    }

    function toggleJarvisMode() {
      if (isJarvisActive) {
        stopJarvisMode();
      } else {
        startJarvisMode();
      }
    }

    function safeStartRecognition() {
      if (!recognition) recognition = initSpeechRecognition();
      if (!recognition) return;
      try {
        recognition.start();
        setStatus('listening', '● 賈維斯聆聽中... (請說話)');
      } catch (e) {}
    }

    function safeStopRecognition() {
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }
    }

    function startJarvisMode() {
      isJarvisActive = true;
      playBeep('wake');
      setStatus('listening', '● 賈維斯在線，阿志請說...');
      safeStartRecognition();
      speak('阿志，我在。你說，我聽著。');
    }

    function stopJarvisMode() {
      isJarvisActive = false;
      safeStopRecognition();
      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }
      if (synth && synth.speaking) {
        synth.cancel();
      }
      isSpeaking = false;
      isThinking = false;
      clearTimeout(silenceTimer);
      setStatus('idle', '點擊反應爐喚醒郎雄老匠人賈維斯');
    }

    // ===== 雙引擎語音朗讀 (TTS) =====
    async function speak(text, callback) {
      safeStopRecognition(); // 播放期間關閉麥克風，防回音結巴

      const clean = text.replace(/[*#`_\[\]()]/g, '').replace(/https?:\/\/\S+/g, '').replace(/\n+/g, '，');

      if (voiceEngine === 'neural') {
        try {
          await speakNeural(clean);
          onSpeakFinished(callback);
          return;
        } catch (err) {
          console.warn('神經語音呼叫失敗，無縫降級本機語音:', err.message);
        }
      }

      // 降級或手動本機模式
      speakLocal(clean, () => onSpeakFinished(callback));
    }

    // 引擎一：微軟神經老聲 (雲健 - 郎雄質感)
    function speakNeural(text) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);

        fetch(NEURAL_TTS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: 'zh-CN-YunjianNeural' }),
          signal: controller.signal
        })
        .then(res => {
          clearTimeout(timeout);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.blob();
        })
        .then(blob => {
          const audioUrl = URL.createObjectURL(blob);
          if (activeAudio) activeAudio.pause();
          activeAudio = new Audio(audioUrl);

          activeAudio.onplay = () => {
            isSpeaking = true;
            setStatus('speaking', '🔊 郎叔回覆中... (點擊反應爐可打斷)');
          };

          activeAudio.onended = () => {
            URL.revokeObjectURL(audioUrl);
            activeAudio = null;
            resolve();
          };

          activeAudio.onerror = (e) => {
            activeAudio = null;
            reject(e);
          };

          activeAudio.play().catch(reject);
        })
        .catch(reject);
      });
    }

    // 引擎二：本機降頻男中低音 (音調 0.82，語速 0.88)
    function speakLocal(text, done) {
      if (!synth) {
        if (done) done();
        return;
      }
      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.88; // 沉緩篤定
      utter.pitch = 0.82; // 壓低音頻，胸腔共鳴

      // 優先選取成熟台灣男聲
      const voices = synth.getVoices();
      const twMaleVoice = voices.find(v => (v.lang.includes('TW') || v.lang.includes('zh')) && 
        (v.name.includes('Male') || v.name.includes('男') || v.name.includes('Han') || v.name.includes('Siri 1') || v.name.includes('Yating')));
      if (twMaleVoice) utter.voice = twMaleVoice;

      utter.onstart = () => {
        isSpeaking = true;
        setStatus('speaking', '🔊 郎叔回覆中... (點擊反應爐可打斷)');
      };

      utter.onend = () => {
        if (done) done();
      };

      utter.onerror = () => {
        if (done) done();
      };

      synth.speak(utter);
    }

    function onSpeakFinished(callback) {
      isSpeaking = false;
      if (isJarvisActive) {
        setStatus('listening', '● 賈維斯聆聽中... (請說話)');
        safeStartRecognition(); // 說完毫秒級自動開麥
      } else {
        setStatus('idle', '已待命');
      }
      if (callback) callback();
    }

    // 處理使用者訊息 (送往 WF-07 大腦)
    async function handleUserQuery(msg) {
      if (!msg || msg.trim() === '') return;
      
      clearTimeout(silenceTimer);
      currentTranscript = '';
      safeStopRecognition();

      appendBubble('user', msg);
      isThinking = true;
      playBeep('thinking');
      setStatus('thinking', '⚡ 郎叔大腦思考中...');

      try {
        const response = await fetch(CHAT_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'sendMessage',
            chatInput: msg,
            sessionId: currentSessionId
          })
        });

        const data = await response.json();
        const reply = data.output || data.text || '……收到。';
        
        isThinking = false;
        appendBubble('assistant', reply);
        speak(reply);

      } catch (err) {
        console.error('Fetch WF-07 Error:', err);
        isThinking = false;
        const errText = '……連線大腦逾時。阿志，確認一下網路。';
        appendBubble('assistant', errText);
        speak(errText);
      }
    }

    function sendManual() {
      const val = textInput.value.trim();
      if (!val) return;
      textInput.value = '';
      handleUserQuery(val);
    }

    function sendQuick(promptText) {
      handleUserQuery(promptText);
    }

    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => synth.getVoices();
    }
  </script>
